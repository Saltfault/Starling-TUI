name: release

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Checkout starling core
        uses: actions/checkout@v6
        with:
          repository: Saltfault/Starling
          path: ../starling
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Extract version
        id: version
        run: echo "value=$(grep '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')" >> "$GITHUB_OUTPUT"
      - name: Check version increased
        id: check
        run: |
          latest_tag=$(git tag --list 'v*' --sort=-v:refname | head -1)
          current="v${{ steps.version.outputs.value }}"
          if [ -z "$latest_tag" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$current" = "$latest_tag" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Install system dependencies
        run: apt-get update && apt-get install -y libasound2-dev libclang-dev
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        if: steps.check.outputs.skip == 'false'
        run: cargo test --all-features

  release:
    needs: detect
    if: needs.detect.outputs.skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkout starling core
        uses: actions/checkout@v6
        with:
          repository: Saltfault/Starling
          path: ../starling
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          export PATH="$HOME/.cargo/bin:$PATH"

      - name: Install tools
        run: |
          apt-get update && apt-get install -y jq

      - name: Install media build dependencies
        run: |
          dpkg --add-architecture arm64
          apt-get update
          apt-get install -y \
            build-essential \
            gcc-aarch64-linux-gnu \
            pkg-config \
            libasound2-dev \
            libpulse-dev \
            libclang-dev \
            libv4l-dev \
            libasound2-dev:arm64 \
            libpulse-dev:arm64 \
            libv4l-dev:arm64

      - name: Build all targets
        run: |
          set -e
          targets=(
            "x86_64-unknown-linux-gnu"
            "aarch64-unknown-linux-gnu:aarch64-linux-gnu-gcc"
          )
          for entry in "${targets[@]}"; do
            IFS=':' read -r target linker <<< "$entry"
            echo "=== Building $target ==="
            rustup target add "$target"
            if [ -n "$linker" ]; then
              target_upper=$(echo "$target" | tr '[:lower:]-' '[:upper:]_')
              export "CARGO_TARGET_${target_upper}_LINKER=$linker"
            fi
            if [ "$target" = "aarch64-unknown-linux-gnu" ]; then
              export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
              export PKG_CONFIG_ALLOW_CROSS=1
              export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
            else
              unset PKG_CONFIG_ALLOW_CROSS PKG_CONFIG_LIBDIR
            fi
            cargo build --release --target "$target" --all-features
            ext=""
            [[ "$target" == *-windows-* ]] && ext=".exe"
            cp "target/$target/release/starling-tui$ext" "starling-tui-$target$ext"
          done

      - name: Download macOS from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.ACTION_TOKEN_GITHUB }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "ACTION_TOKEN_GITHUB not set, skipping macOS download"
            exit 0
          fi
          TAG="v${{ needs.detect.outputs.version }}"
          for i in $(seq 1 60); do
            response=$(curl --fail --silent --show-error \
              "https://api.github.com/repos/Saltfault/Starling-TUI/releases/tags/$TAG" \
              -H "Authorization: Bearer $GH_TOKEN" || true)
            asset_count=$(echo "$response" | jq '.assets | length' 2>/dev/null || echo 0)
            if [ "$asset_count" -ge 3 ]; then
              assets=$(echo "$response" | jq -r '.assets[].browser_download_url')
              break
            fi
            echo "Waiting for all GitHub artifacts ($asset_count/3), retry $i/60..."
            sleep 30
          done
          if [ "${asset_count:-0}" -lt 3 ]; then
            echo "GitHub release did not publish all three native artifacts"
            exit 1
          fi
          echo "$assets" | while read url; do
            [ -z "$url" ] && continue
            file=$(basename "$url")
            echo "Downloading $file"
            curl -sSL -o "$file" "$url"
          done

      - name: Create Forgejo Release
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.detect.outputs.version }}"
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO="${GITHUB_REPOSITORY#*/}"
          API="https://${GITHUB_SERVER_URL#https://}/api/v1"

          mkdir -p artifacts
          mv starling-tui-* artifacts/ 2>/dev/null || true

          curl -s -X DELETE "$API/repos/$OWNER/$REPO/releases/tags/$TAG" \
            -H "Authorization: Bearer $FORGEJO_TOKEN" > /dev/null 2>&1

          release_id=$(curl -s -X POST "$API/repos/$OWNER/$REPO/releases" \
            -H "Authorization: Bearer $FORGEJO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"draft\":false,\"prerelease\":false}" | jq -r '.id // empty')

          if [ -z "$release_id" ]; then
            echo "Failed to create Forgejo release"
            exit 1
          fi

          expected_count=$(find artifacts -maxdepth 1 -type f | wc -l)
          for f in artifacts/*; do
            [ ! -f "$f" ] && continue
            echo "Uploading $(basename $f)"
            curl --fail-with-body --silent --show-error \
              -X POST "$API/repos/$OWNER/$REPO/releases/$release_id/assets" \
              -H "Authorization: Bearer $FORGEJO_TOKEN" \
              -F "attachment=@$f"
          done

          uploaded_count=$(curl --fail --silent --show-error \
            "$API/repos/$OWNER/$REPO/releases/$release_id" \
            -H "Authorization: Bearer $FORGEJO_TOKEN" | jq '.assets | length')
          if [ "$uploaded_count" -ne "$expected_count" ] || [ "$uploaded_count" -ne 5 ]; then
            echo "Expected 5 release assets, uploaded $uploaded_count from $expected_count files"
            exit 1
          fi
          echo "Forgejo release $TAG created with $uploaded_count assets"
