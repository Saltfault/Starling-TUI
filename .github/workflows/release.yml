name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Checkout starling core
        uses: actions/checkout@v6
        with:
          repository: Saltfault/Starling
          path: starling
      - name: Point patch to local starling
        run: sed -i 's|path = "../starling"|path = "./starling"|' Cargo.toml
      - name: Extract version
        id: version
        run: echo "value=$(grep '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')" >> "$GITHUB_OUTPUT"
      - name: Check version increased
        id: check
        run: |
          latest_tag=$(git tag --list 'v*' --sort=-v:refname | head -1)
          current="v${{ steps.version.outputs.value }}"
          if [ -z "$latest_tag" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$current" = "$latest_tag" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libclang-dev
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all-features

  build:
    needs: detect
    if: needs.detect.outputs.skip == 'false'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Checkout starling core
        uses: actions/checkout@v6
        with:
          repository: Saltfault/Starling
          path: ../starling
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Install Opus for Intel macOS
        if: matrix.target == 'x86_64-apple-darwin'
        run: brew install opus
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} --all-features
      - name: Prepare binary
        shell: bash
        run: |
          ext=""
          [[ "${{ matrix.target }}" == *-windows-* ]] && ext=".exe"
          cp "target/${{ matrix.target }}/release/starling-tui$ext" "starling-tui-${{ matrix.target }}$ext"
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: starling-tui-${{ matrix.target }}
          path: starling-tui-${{ matrix.target }}*

  release:
    needs: [detect, build]
    if: needs.detect.outputs.skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.detect.outputs.version }}
          files: artifacts/**/*
          body: |
            ## Which download?

            - Windows (64-bit) ............. `starling-tui-x86_64-pc-windows-msvc.exe`
            - macOS (M1–M4) ............... `starling-tui-aarch64-apple-darwin`
            - macOS (Intel) ............... `starling-tui-x86_64-apple-darwin`
            - Linux (x64) ................. `starling-tui-x86_64-unknown-linux-gnu`
            - Linux (ARM64 / Pi 4+) ........ `starling-tui-aarch64-unknown-linux-gnu`
